services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: soc-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: soc
      CLICKHOUSE_USER: soc_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: soc-vector
    restart: unless-stopped
    depends_on:
      - clickhouse
    volumes:
      - ./suricata:/suricata:ro
      - ./suricata/eve2vector.toml:/etc/vector/vector.toml:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    command: ["--config", "/etc/vector/vector.toml"]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: soc-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource

  n8n:
    image: n8nio/n8n:1.65.1
    container_name: soc-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      - n8n-db
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/backup_workflows:ro
    environment:
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8npass}

  n8n-db:
    image: postgres:16-alpine
    container_name: soc-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8npass}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data

volumes:
  clickhouse-data:
  grafana-data:
  n8n-data:
  n8n-db-data:
